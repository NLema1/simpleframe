[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simpleframe"
version = "0.1.0"
description = "Readable Polars wrappers so AI-generated data code makes sense to humans."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Natenael Lema" }
]
requires-python = ">=3.9"
dependencies = [
    "polars>=1.0.0",
]
keywords = ["polars", "dataframe", "data-analysis", "ai", "readable", "beginner"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
excel = ["fastexcel>=0.10"]

[project.urls]
Homepage = "https://github.com/yourname/simpleframe"
Issues = "https://github.com/yourname/simpleframe/issues"

[tool.setuptools.packages.find]
include = ["simpleframe*"]
